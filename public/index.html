<!-- HTML shell for the installable Life Analytics web app. -->
<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="application-name" content="Life Analytics" />
    <meta name="description" content="Turn your day, in your words, into a calm personal timeline." />
    <meta name="theme-color" content="#123D37" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Life Analytics" />
    <link rel="manifest" href="/SoloLeveling/manifest.json" />
    <link rel="apple-touch-icon" href="/SoloLeveling/icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,800&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" />
    <title>Life Analytics</title>
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
        background: #F3EFE5;
        color: #12302C;
        font-family: "Source Sans 3", "Source Sans Pro", Helvetica, Arial, sans-serif;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
        background: #F3EFE5;
      }
    </style>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.getRegistrations().then((registrations) => {
            const stale = registrations.filter((registration) => registration.scope.includes("/SoloLeveling"));
            Promise.all(stale.map((registration) => registration.unregister())).finally(() => {
              navigator.serviceWorker
                .register("/SoloLeveling/sw.js", { scope: "/SoloLeveling/" })
                .catch((error) => console.error("Service worker registration failed:", error));
            });
          });
        });
      }
    </script>
  </head>

  <body>
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <div id="root"></div>
  </body>
</html>
