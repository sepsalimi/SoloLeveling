name: Deploy DeepSeek reasoning backend
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/phone-preview-20260928
      - name: Check configuration
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Add the SUPABASE_ACCESS_TOKEN repository secret."; exit 1; }
          test -n "$SUPABASE_PROJECT_REF" || { echo "Add the SUPABASE_PROJECT_REF repository variable."; exit 1; }
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # The function validates the user JWT against /auth/v1/user itself.
      - run: supabase functions deploy reason-check-in --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
